name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test
        run: python brainlib.py selftest
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: brainlib.cmd selftest
      - name: Privacy scan of this repository
        run: python brainlib.py privacy scan --mode commit --path .
